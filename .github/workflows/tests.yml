name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    # `labeled` lets the run-instrumented-tests label trigger the
    # instrumented-test job on a PR (see that job's `if` below).
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis (detekt, ktlint, Android Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x shelfscan/gradlew

      # Baseline mode: existing findings live in the checked-in *-baseline.xml
      # files, so only newly introduced issues fail this job.
      - name: Run detekt, ktlint and Android Lint
        working-directory: shelfscan
        run: ./gradlew detekt ktlintCheck :androidApp:lintDebug --no-daemon

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            shelfscan/*/build/reports/detekt/
            shelfscan/*/build/reports/ktlint/
            shelfscan/androidApp/build/reports/lint-results-*.html
          retention-days: 14

  unit-tests:
    name: Unit tests (shared JVM + androidApp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x shelfscan/gradlew

      - name: Run shared and androidApp unit tests
        working-directory: shelfscan
        run: ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            shelfscan/shared/build/reports/tests/
            shelfscan/androidApp/build/reports/tests/
          retention-days: 14

  instrumented-tests:
    name: Android instrumented tests
    # macOS runners support HW-accelerated x86_64 emulators.
    # Limited to push-to-main to keep macOS minute usage in check;
    # on PRs the job is opt-in via the run-instrumented-tests label.
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-instrumented-tests')
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x shelfscan/gradlew

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: cd shelfscan && ./gradlew :androidApp:connectedAndroidTest --no-daemon

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: shelfscan/androidApp/build/reports/androidTests/
          retention-days: 14
